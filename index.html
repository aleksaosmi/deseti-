<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taša ljubav moja</title>
  <meta name="description" content="Stranica posvećena ljubavi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --crvena: #e60026;
      --bg-main: #fff5f7;
    }
    body {
      background: var(--bg-main);
      color: var(--crvena);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
      font-family: 'Playfair Display', serif;
    }
    h1 {
      font-size: clamp(20rem, 25vw, 20rem);
      font-family: 'Parisienne', cursive;
      color: var(--crvena);
      margin-bottom: 2rem;
      animation: fadeInDown 2s ease-out;
      text-shadow: 3px 3px 8px rgba(230, 0, 38, 0.4);
    }
    p {
      font-size: clamp(2rem, 4vw, 3.5rem);
      color: var(--crvena);
      font-family: 'Playfair Display', serif;
      animation: fadeInUp 2.5s ease-out;
      text-shadow: 1px 1px 4px rgba(230, 0, 38, 0.2);
    }
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1>Dobrodošla ljubavi moja</h1>
  <p>Taša ljubav moja</p>
</body>
</html>
