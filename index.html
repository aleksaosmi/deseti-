<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taša ljubav moja</title>
  <meta name="description" content="Stranica posvećena ljubavi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --crvena: #e60026;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      color: var(--crvena);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
      font-family: 'Playfair Display', serif;
      backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #00bcd4, #a2eafc);
      background-size: 400% 400%;
      animation: gradientBG 60s ease infinite;
      transition: background 20s ease, color 3s ease;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; background: linear-gradient(145deg, #00bcd4, #a2eafc); }
      10% { background: linear-gradient(145deg, #ffc0cb, #ff9aa2); }
      20% { background: linear-gradient(145deg, #ffdde1, #ee9ca7); }
      30% { background: linear-gradient(145deg, #f3d9fa, #a18cd1); }
      40% { background: linear-gradient(145deg, #e0c3fc, #8ec5fc); }
      50% { background: linear-gradient(145deg, #d0c7ff, #a1c4fd); }
      60% { background: linear-gradient(145deg, #fcb69f, #ffecd2); }
      70% { background: linear-gradient(145deg, #f9c5d1, #9795f0); }
      80% { background: linear-gradient(145deg, #fbc2eb, #a6c1ee); }
      90% { background: linear-gradient(145deg, #f6d365, #fda085); }
      100% { background-position: 100% 50%; background: linear-gradient(145deg, #00bcd4, #a2eafc); }
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,192,203,0.2) 0%, transparent 70%);
      animation: shimmer 6s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes shimmer {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 0.6; }
    }

    h1 {
      font-size: clamp(22rem, 38vw, 42rem);
      font-family: 'Parisienne', cursive;
      color: var(--crvena);
      margin-bottom: 2rem;
      animation: fadeInDown 2s ease-out;
      text-shadow: 8px 8px 20px rgba(230, 0, 38, 0.7);
      position: relative;
    }

    h1::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: shine 4s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    p {
      font-size: clamp(1.5rem, 3.5vw, 3rem);
      color: var(--crvena);
      font-family: 'Playfair Display', serif;
      animation: fadeInUp 2.5s ease-out;
      text-shadow: 1px 1px 4px rgba(230, 0, 38, 0.2);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart-button {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 70px;
      height: 70px;
      background: linear-gradient(145deg, #ff4d6d, #b3001b);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      transition: transform 0.3s;
      animation: pulseHeart 4s ease-in-out infinite;
    }

    .heart-button:hover {
      transform: scale(1.15);
    }

    @keyframes pulseHeart {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .dollar {
      position: absolute;
      color: green;
      font-size: 2rem;
      animation: fall linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-100px); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    .heart-3d, .heart-3d2, .heart-3d3 {
      width: 100px;
      height: 90px;
      position: absolute;
      transform-style: preserve-3d;
      animation: rotate 8s linear infinite;
    }

    .heart-3d { top: 10%; right: 10%; }
    .heart-3d2 { top: 20%; left: 10%; animation-delay: 2s; }
    .heart-3d3 { bottom: 15%; right: 20%; animation-delay: 4s; }

    .heart-3d::before,
    .heart-3d::after,
    .heart-3d2::before,
    .heart-3d2::after,
    .heart-3d3::before,
    .heart-3d3::after {
      content: "❤️";
      position: absolute;
      font-size: 5rem;
      transform: translateZ(50px);
    }

    .heart-3d::after,
    .heart-3d2::after,
    .heart-3d3::after {
      transform: rotateY(180deg) translateZ(50px);
    }

    @keyframes rotate {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(360deg); }
    }

    .counter {
      position: fixed;
      left: 110px;
      bottom: 30px;
      font-size: 2rem;
      background: #fff0f2;
      color: #e60026;
      padding: 10px 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(230, 0, 38, 0.4);
      font-family: 'Playfair Display', serif;
    }

    .spinner {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top: 5px solid red;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    @keyframes spin {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body onload="document.getElementById('loading-spinner').style.display='none'">
  <div id="loading-spinner" class="spinner"></div>
  <div class="heart-3d"></div>
  <div class="heart-3d2"></div>
  <div class="heart-3d3"></div>
  <h1>ljubavice</h1>
  <p>Taša ljubav moja</p>
  <div class="heart-button" onclick="spawnDollars()" aria-label="Dodaj ljubav">❤️</div>
  <div class="counter" id="counter">$0</div>
  <script>
    let total = 0;
    function spawnDollars() {
      total += 100;
      document.getElementById('counter').innerText = "$" + total;
      for (let i = 0; i < 30; i++) {
        const dollar = document.createElement('div');
        dollar.className = 'dollar';
        dollar.innerText = '$';
        dollar.style.left = Math.random() * 100 + 'vw';
        dollar.style.animationDuration = (Math.random() * 3 + 2) + 's';
        document.body.appendChild(dollar);
        setTimeout(() => dollar.remove(), 5000);
      }
    }
  </script>
</body>
</html>
